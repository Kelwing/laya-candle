[package]
name = "laya-candle"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Pure-Rust runtime for the Laya calibrated decision models, built on candle"
repository = "https://github.com/Kelwing/laya-candle"
readme = "README.md"
keywords = ["laya", "candle", "classification", "modernbert", "ml"]
categories = ["science"]

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
unicode-general-category = "1"
hf-hub = { version = "1", features = ["blocking"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[features]
default = ["hub"]
hub = ["dep:hf-hub"]
cli = ["dep:clap"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
cudnn = ["cuda", "candle-core/cudnn"]
metal = ["candle-core/metal", "candle-nn/metal"]

[[bin]]
name = "laya"
path = "src/bin/laya.rs"
required-features = ["cli"]
